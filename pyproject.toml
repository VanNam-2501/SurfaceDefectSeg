[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threecad-ani-defect-segmentation"
version = "1.0.0"
description = "Thesis pipeline for 3CAD-ANI aluminum surface defect segmentation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests/ml", "apps/dataset_review/tests"]
pythonpath = ["src/threecad_segmentation", "apps/dataset_review"]

