[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "straw-defect-inspection"
version = "1.0.0"
description = "Straw defect classification research and DeepStream/TensorRT demo"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
research = ["torch>=2.2", "torchvision>=0.17", "pandas>=2.0", "scipy>=1.10",
    "scikit-learn>=1.3", "matplotlib>=3.7", "tqdm>=4.65", "PyYAML>=6", "psutil>=5"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src.straw_global_local*", "src.straw_defect_cls*", "src.inspection_research*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/ml --ignore=tests/test_web_api.py --ignore=tests/test_b1_deployment.py"
pythonpath = ["src/threecad_segmentation", "apps/dataset_review"]
markers = [
    "gpu: requires a CUDA-enabled runtime",
    "integration: optional integration test",
]

